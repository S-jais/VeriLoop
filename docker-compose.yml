services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veriloop-backend
    ports:
      - "8000:8000"
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NEBIUS_API_BASE=${NEBIUS_API_BASE:-https://api.tokenfactory.us-central1.nebius.com/v1}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      - PROBE_MODEL=${PROBE_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      - DIAGNOSIS_MODEL=${DIAGNOSIS_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      - JUDGE_MODEL=${JUDGE_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      - FAST_MODEL=${FAST_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/veriloop.db
    volumes:
      - veriloop-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/info"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veriloop-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  veriloop-data:
    driver: local
